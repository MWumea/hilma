<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hilmas hemliga arv</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="info">
            <img src="images/spelkontroller.jpg" alt="Instruktioner för VR-kontroller" class="controls-image">
            <h1>Hilmas hemliga arv</h1>
            <p>Du är nu Hilmas betrodda observatör, hennes “öga” i det förseglade galleriet. Din uppgift kräver skarp iakttagelseförmåga. Granska de fem utvalda målningarna med yttersta precision. Varje symbol eller detalj kan vara en potentiell pusselbit.</p>
            <button id="enterVR" style="display: none;">Starta spelet</button>
        </div>
        <div id="timer" style="display: none;">05:00</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script src="scripts/XRControllerModelFactory.js"></script>
    
    <script src="scripts/paintings.js"></script>
    <script src="scripts/room.js"></script>
    <script src="scripts/objects.js"></script>
    
    <script src="scripts/main.js"></script>
</body>
</html>
